<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Bhotekoshi Flood (Aug 2026) Verified Relief Tracker</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"><\/script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="tracker()" x-init="init()">
<header class="bg-gradient-to-r from-red-900 via-red-800 to-orange-900 border-b border-red-700">
<div class="max-w-7xl mx-auto px-4 py-6 sm:py-8">
<h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-white mb-2">Nepal Bhotekoshi Flood (Aug 2026) Verified Relief Tracker</h1>
<p class="text-red-200 text-sm sm:text-base mb-5">Tracking, verifying & scoring relief funding campaigns for Rasuwa, Nuwakot & Dhading districts</p>
<div class="flex flex-wrap gap-4 sm:gap-8">
<div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-white" x-text="$store.fmt(stats.totalFunds)"></div><div class="text-xs sm:text-sm text-red-200 uppercase tracking-wider">Total Raised</div></div>
<div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-green-400" x-text="stats.verified"></div><div class="text-xs sm:text-sm text-red-200 uppercase tracking-wider">Verified</div></div>
<div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-yellow-400" x-text="stats.community"></div><div class="text-xs sm:text-sm text-red-200 uppercase tracking-wider">Community</div></div>
<div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-red-400" x-text="stats.flagged"></div><div class="text-xs sm:text-sm text-red-200 uppercase tracking-wider">Flagged</div></div>
</div></div></header>
<div class="max-w-7xl mx-auto px-4 py-4">
<div class="bg-gray-900 rounded-xl border border-gray-800 p-4 flex flex-col sm:flex-row gap-3">
<div class="flex-1"><input type="text" x-model="search" placeholder="Search campaigns..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500"></div>
<div class="flex gap-2 flex-wrap">
<select x-model="filterPlatform" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
<option value="">All Platforms</option><option value="GoFundMe">GoFundMe</option><option value="GlobalGiving">GlobalGiving</option><option value="JustGiving">JustGiving</option><option value="Bank Transfer">Bank Transfer</option><option value="Crypto/Web3">Crypto/Web3</option>
</select>
<select x-model="filterStatus" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
<option value="">All Trust Levels</option><option value="verified">Verified Official</option><option value="community">Community/Local</option><option value="flagged">Unverified/High Risk</option>
</select>
</div></div></div>
<div class="max-w-7xl mx-auto px-4 pb-12"><div class="grid gap-4">
<template x-for="c in filteredCampaigns" :key="c.id">
<div class="bg-gray-900 rounded-xl border border-gray-800 p-4 sm:p-5 hover:border-gray-600 transition-colors">
<div class="flex flex-col lg:flex-row lg:items-start gap-4">
<div class="flex-1 min-w-0">
<div class="flex flex-wrap items-center gap-2 mb-2">
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider" :class="c.trustStatus==='verified'?'bg-green-900/50 text-green-400 border border-green-700':c.trustStatus==='community'?'bg-yellow-900/50 text-yellow-400 border border-yellow-700':'bg-red-900/50 text-red-400 border border-red-700'" x-text="c.trustStatus==='verified'?'Verified':c.trustStatus==='community'?'Community':'High Risk'"></span>
<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-800 text-gray-300 border border-gray-700" x-text="c.platform"></span>
<span class="text-xs text-gray-500" x-text="'Score: '+c.trustScore+'/100'"></span>
</div>
<h3 class="text-base sm:text-lg font-semibold text-white mb-1"><a :href="c.url" target="_blank" rel="noopener" class="hover:text-red-400 transition-colors" x-text="c.title"></a></h3>
<div class="text-sm text-gray-400 mb-2"><span class="font-medium text-gray-300" x-text="c.organizer"></span><span class="mx-1">·</span><span x-text="c.organizer_type"></span><template x-if="c.registration_id"><span><span class="mx-1">·</span><span class="text-green-500" x-text="c.registration_id"></span></span></template></div>
<div class="text-xs text-gray-500 mb-3" x-text="c.location"></div>
<p class="text-sm text-gray-400 line-clamp-2 leading-relaxed" x-text="c.story.substring(0,200)+'...'"></p>
</div>
<div class="lg:w-64 flex-shrink-0"><div class="text-right lg:text-left">
<div class="text-2xl font-bold text-white" x-text="$store.fmt(c.funds_raised_usd)"></div>
<div class="text-sm text-gray-500 mb-3">of <span x-text="$store.fmt(c.target_usd)"></span></div>
<div class="w-full bg-gray-800 rounded-full h-2.5 mb-2"><div class="h-2.5 rounded-full transition-all" :class="c.trustStatus==='verified'?'bg-green-500':c.trustStatus==='community'?'bg-yellow-500':'bg-red-500'" :style="'width:'+Math.min(c.funds_raised_usd/c.target_usd*100,100)+'%'"></div></div>
<div class="text-xs text-gray-500" x-text="Math.round(c.funds_raised_usd/c.target_usd*100)+'% funded'"></div>
</div></div></div></div></template>
</div></div>
<footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-600">
<p>Verification scores are algorithmic estimates. Always do your own research before donating.</p>
</footer>
<script>
function trigrams(s){s=s.toLowerCase();const t=new Set();for(let i=0;i<=s.length-3;i++)t.add(s.substring(i,i+3));return t}
function jaccard(a,b){if(!a.size&&!b.size)return 1;let i=0;for(const t of a)if(b.has(t))i++;return i/(a.size+b.size-i)}
function scoreCampaign(c,all){let s=50;const h=(Date.now()-new Date(c.created_date).getTime())/36e5;if(h<72)s-=30;const r=(c.registration_id||'').toLowerCase();if(r.startsWith('swc'))s+=40;else if(r.startsWith('gov'))s+=45;const mt=trigrams(c.story);for(const o of all){if(o.id===c.id)continue;if(jaccard(mt,trigrams(o.story))>0.75){s-=40;break}}if(c.organizer_type==='Anonymous')s-=20;if(c.wallet_address)s-=15;if(c.platform==='GlobalGiving')s+=5;if(c.platform==='Crypto/Web3')s-=10;s=Math.max(0,Math.min(100,s));let st='community';if(s>=80)st='verified';else if(s<35)st='flagged';return{...c,trustScore:s,trustStatus:st}}
function tracker(){return{campaigns:[],search:'',filterPlatform:'',filterStatus:'',stats:{totalFunds:0,verified:0,community:0,flagged:0},async init(){const r=await fetch('data/campaigns.json');const raw=await r.json();this.campaigns=raw.map(c=>scoreCampaign(c,raw));this.stats.totalFunds=this.campaigns.reduce((s,c)=>s+c.funds_raised_usd,0);this.stats.verified=this.campaigns.filter(c=>c.trustStatus==='verified').length;this.stats.community=this.campaigns.filter(c=>c.trustStatus==='community').length;this.stats.flagged=this.campaigns.filter(c=>c.trustStatus==='flagged').length},get filteredCampaigns(){return this.campaigns.filter(c=>{const q=this.search.toLowerCase();if(q&&!c.title.toLowerCase().includes(q)&&!c.organizer.toLowerCase().includes(q)&&!c.story.toLowerCase().includes(q))return false;if(this.filterPlatform&&c.platform!==this.filterPlatform)return false;if(this.filterStatus&&c.trustStatus!==this.filterStatus)return false;return true})}}}
document.addEventListener('alpine:init',()=>{Alpine.store('fmt',v=>'$'+v.toLocaleString('en-US'))});
</script>
</body></html>
